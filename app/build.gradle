plugins {
    id 'com.android.application'
}

// Release signing: keystore.properties (local) or environment variables (GitHub Actions).
def ksProps = new Properties()
def ksFile = rootProject.file('keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
def ksPath = ksProps.getProperty('storeFile') ?: System.getenv('KEYSTORE_FILE')
def hasReleaseKey = ksPath != null && rootProject.file(ksPath).exists()

android {
    namespace 'com.vrtune.optimizer'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vrtune.optimizer'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile rootProject.file(ksPath)
                storePassword ksProps.getProperty('storePassword') ?: System.getenv('KEYSTORE_PASSWORD')
                keyAlias ksProps.getProperty('keyAlias') ?: System.getenv('KEY_ALIAS')
                keyPassword ksProps.getProperty('keyPassword') ?: System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Falls back to the debug key so the APK is always installable.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

base {
    archivesName = 'VRTune'
}
